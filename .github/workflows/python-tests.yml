name: Python CPU tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and tests
        run: python -m pip install -e ".[dev]"
      - name: Compile all Python code before running tests
        run: python -m compileall -q src tests examples
      - name: Run CPU tests (CUDA tests skip when unavailable)
        run: |
          mkdir -p reports
          python -m pytest -q --junitxml=reports/pytest.xml
      - name: Upload test report, even when pytest fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-pytest-junit
          path: reports/pytest.xml
          if-no-files-found: warn
