name: Python CPU tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and tests
        run: python -m pip install -e ".[dev]"
      - name: Run CPU tests (CUDA tests skip when unavailable)
        run: python -m pytest -q
